name: Android Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "shared/**"
      - "ui/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/piko-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PIKO_VERSION_NAME: 1.4.1
      PIKO_VERSION_CODE: 1004001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build signed universal release APK
        run: ./gradlew :app:assembleRelease -Ppiko.enableAbiSplits=false --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"
      - name: Collect APK and mapping
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/piko-1.4.1-universal.apk
          cp app/build/outputs/mapping/release/mapping.txt dist/piko-1.4.1-mapping.txt
          ls -lh dist
      - name: Package corresponding source
        run: |
          # The upstream AGPL license requires corresponding source availability when distributing the APK.
          git archive --format=tar.gz --output="dist/piko-$PIKO_VERSION_NAME-source.tar.gz" HEAD
          test -s "dist/piko-$PIKO_VERSION_NAME-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: piko-share-release-apk
          path: dist/*
          retention-days: 14
          if-no-files-found: error


      - name: Publish signed APK and update metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$UPDATE_REPOSITORY" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::$UPDATE_REPOSITORY must be public so Android can check releases without a token."
            exit 1
          fi
          tag="v$PIKO_VERSION_NAME"
          if gh release view "$tag" --repo "$UPDATE_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --repo "$UPDATE_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              # Repair metadata without replacing the published, signed APK.
              gh api "repos/$UPDATE_REPOSITORY/releases/tags/$tag" \
                | jq --arg repo "$UPDATE_REPOSITORY" --arg tag "$tag" '{tag_name,html_url,body,draft:false,prerelease:false,assets: [.assets[] | select(.name | endswith(".apk")) | {name,size,browser_download_url:("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + .name),digest}]}' \
                > dist/release.json
              jq -e '.assets | length > 0 and all(.[]; (.digest | type == "string" and startswith("sha256:")))' dist/release.json >/dev/null
              gh release upload "$tag" dist/release.json --repo "$UPDATE_REPOSITORY" --clobber
              exit 0
            fi
          else
            gh release create "$tag" --repo "$UPDATE_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Piko $PIKO_VERSION_NAME" \
              --notes "Web 代理支持添加、测试、保存、选择和删除；启用后外部业务请求统一中继，失败不回退直连；分享列表显示图片缩略图和视频封面。"
          fi
          gh release upload "$tag" "dist/piko-$PIKO_VERSION_NAME-universal.apk" \
            "dist/piko-$PIKO_VERSION_NAME-source.tar.gz" --repo "$UPDATE_REPOSITORY" --clobber
          # GitHub computes release-asset SHA-256 on upload. It must be present
          # in both API metadata and the fallback release.json for secure installs.
          release_id="$(gh api "repos/$UPDATE_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          test -n "$release_id"
          gh api "repos/$UPDATE_REPOSITORY/releases/$release_id" \
            | jq --arg repo "$UPDATE_REPOSITORY" --arg tag "$tag" '{tag_name,html_url,body,draft:false,prerelease:false,assets: [.assets[] | select(.name | endswith(".apk")) | {name,size,browser_download_url:("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + .name),digest}]}' \
            > dist/release.json
          jq -e '.assets | length > 0 and all(.[]; (.digest | type == "string" and startswith("sha256:")))' \
            dist/release.json >/dev/null
          gh release upload "$tag" dist/release.json --repo "$UPDATE_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$UPDATE_REPOSITORY" --draft=false
          echo "Public update released: https://github.com/$UPDATE_REPOSITORY/releases/tag/$tag"
