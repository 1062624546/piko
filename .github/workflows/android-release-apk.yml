name: Android Release APK (feature)

on:
  push:
    branches:
      - feature/share-browser-private
    paths:
      - "app/**"
      - "shared/**"
      - "ui/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-release-apk-feature
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/piko-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PIKO_VERSION_NAME: 1.3.0
      PIKO_VERSION_CODE: 1003000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Build signed universal release APK
        run: ./gradlew :app:assembleRelease -Ppiko.enableAbiSplits=false --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"
      - name: Collect APK and mapping
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/piko-1.3.0-universal.apk
          cp app/build/outputs/mapping/release/mapping.txt dist/piko-1.3.0-mapping.txt
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: piko-share-release-apk
          path: dist/*
          retention-days: 14
          if-no-files-found: error
