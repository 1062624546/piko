name: Remove merged development branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-branches.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the two development branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          delete_branch() {
            branch="$1"
            expected="$2"
            actual="$(gh api "repos/$REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Branch $branch changed; refusing to delete."
              exit 1
            fi
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
          }
          delete_branch feature/own-updates-image-preview dd25b0369fb5b52abb84a75bfd2279d5bb173538
          delete_branch feature/share-browser-private e1afbcd18006c481b4c36d440bee1a8e6f93ce01
