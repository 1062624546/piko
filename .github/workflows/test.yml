name: Android and shared tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    # 代理与共用 state holder 的冒烟、以及大部分业务逻辑的单测都在 shared 的 desktop 测试里，
    # 不依赖 Windows，放 Linux 上跑得最快
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Shared smoke tests
        run: ./gradlew :shared:desktopTest :ui:desktopTest --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jvm-smoke-reports
          path: |
            shared/build/reports/tests/
            ui/build/reports/tests/
          if-no-files-found: ignore

  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-report
          path: app/build/reports/tests
          retention-days: 7
