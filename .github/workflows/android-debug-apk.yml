name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/share-browser-private

permissions:
  contents: read

concurrency:
  group: android-debug
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build universal Android debug APK
        run: ./gradlew :app:assembleDebug -Ppiko.enableAbiSplits=false --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piko-share-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
